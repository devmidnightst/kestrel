name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: random programs
        run: KESTREL_RANDOM_PROGRAMS=200 go test -count=1 -run TestRandomProgramsCompileAndRun ./internal/compiler
      - name: random programs under sanitizers
        run: KESTREL_RANDOM_PROGRAMS=200 go test -count=1 -v -run TestRandomProgramsUnderSanitizers ./internal/compiler
      - name: fuzz
        run: |
          for target in FuzzLex FuzzParse FuzzCheckAndGenerate; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s ./internal/compiler
          done
      - name: examples
        run: |
          go build -o kestrel ./cmd/kestrel
          for f in examples/*.ks examples/modules/main.ks; do
            ./kestrel run "$f" < /dev/null > /dev/null
            ./kestrel run --release "$f" < /dev/null > /dev/null
          done
          ./kestrel build --release examples/http/service.ks -o service
      - name: install script syntax
        run: sh -n install.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: builder image
        run: docker build -t kestrel .
      - name: app image
        run: docker build -t hello-service -f examples/deploy/Dockerfile examples/http
      - name: smoke test
        run: |
          docker run -d --name svc -p 8080:8080 hello-service
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q "hello from kestrel"
          docker stop -t 10 svc
          test "$(docker inspect -f '{{.State.ExitCode}}' svc)" = 0
          docker logs svc 2>&1 | grep -q "shut down"
