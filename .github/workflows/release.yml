name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          go build -trimpath -ldflags "-s -w -X github.com/devmidnightst/kestrel/internal/cli.Version=${version}" -o kestrel ./cmd/kestrel
          tar -czf "kestrel-${version}-${GOOS}-${GOARCH}.tar.gz" kestrel
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kestrel-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes "Prebuilt kestrel binaries. The compiler still needs a C compiler (cc, gcc, or clang) on the machine that builds Kestrel programs."
